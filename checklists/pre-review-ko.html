<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3분 환경·EHS 사전점검 | Dime Works</title><style>body{font-family:Arial,'Pretendard',sans-serif;max-width:760px;margin:auto;padding:32px 20px;color:#1B2A2F;line-height:1.7}h1,h2{color:#0C536A}.lead{color:#5C6B70}.box{border:1px solid #D7E2E4;border-radius:10px;padding:18px;margin:16px 0}.item{display:block;margin:9px 0}.note{background:#E8F4FA;padding:14px;border-radius:8px}.btn{background:#0C536A;color:#fff;border:0;border-radius:6px;padding:10px 14px}@media print{.hide{display:none}}</style></head><body><p class="hide"><a href="../ko.html">← 홈으로</a></p><h1>내 프로젝트, 어떤 검토가 필요할까요?</h1><p class="lead">아래 항목을 가볍게 체크해보세요. 모든 자료가 준비되어 있지 않아도 괜찮습니다. 현재 상황을 파악하는 첫 단계입니다.</p><button class="btn hide" onclick="window.print()">인쇄 / PDF 저장</button><div class="box"><h2>먼저 내 상황을 골라보세요</h2><label class="item"><input type="checkbox"> 공장·부지의 인수 또는 매각을 검토 중이다</label><label class="item"><input type="checkbox"> 본사나 투자자가 환경·EHS 자료를 요구했다</label><label class="item"><input type="checkbox"> 토양·지하수 오염이 확인됐거나 의심된다</label><label class="item"><input type="checkbox"> 공장 철거·이전·신축을 준비 중이다</label><label class="item"><input type="checkbox"> 매립장·소각장·폐기물 시설 투자를 검토 중이다</label></div><div class="box"><h2>이런 정보가 비어 있나요?</h2><label class="item"><input type="checkbox"> 과거 토양·지하수 조사보고서가 없다</label><label class="item"><input type="checkbox"> 인허가와 실제 설비가 맞는지 확신하기 어렵다</label><label class="item"><input type="checkbox"> 폐기물 분류·보관·반출 기록이 흩어져 있다</label><label class="item"><input type="checkbox"> 석면·PCB·유해물질 조사 여부를 모른다</label><label class="item"><input type="checkbox"> 사고·시정조치·감사 대응 자료가 정리되지 않았다</label></div><div class="note"><strong>체크 결과</strong><br>하나라도 해당된다면 검토 범위를 먼저 정해두는 것이 좋습니다. 완성된 자료가 없어도 현재 가진 자료와 일정부터 협의할 수 있습니다.</div><p><strong>상담을 원하시면</strong><br>대상 시설, 프로젝트 목적, 대략적인 일정만 알려주세요. 필요한 서비스와 다음 단계를 안내해 드립니다.</p><p><a href="../ko.html#contact">프로젝트 상담 요청 →</a></p></body></html>
