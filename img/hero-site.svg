<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Industrial site with soil sampling and monitoring well illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F4FA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E8F4FA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- soft backdrop -->
  <circle cx="340" cy="230" r="210" fill="url(#sky)"/>

  <!-- ground surface -->
  <rect x="40" y="330" width="560" height="6" rx="3" fill="#0C536A"/>

  <!-- soil cross-section -->
  <rect x="40" y="336" width="560" height="38" fill="#D6EBF5"/>
  <rect x="40" y="374" width="560" height="34" fill="#C9DDD9"/>
  <rect x="40" y="408" width="560" height="30" fill="#B6CFCA"/>
  <!-- groundwater -->
  <path d="M40 424 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#1C7293" stroke-width="3" stroke-linecap="round"/>

  <!-- factory building -->
  <rect x="90" y="215" width="210" height="115" rx="4" fill="#0C536A"/>
  <!-- sawtooth roof -->
  <path d="M90 215 L125 185 L125 215 L160 185 L160 215 L195 185 L195 215 L230 185 L230 215 L265 185 L265 215 L300 185 L300 215 Z" fill="#1C7293"/>
  <!-- windows -->
  <g fill="#E8F4FA">
    <rect x="108" y="240" width="26" height="22" rx="2"/>
    <rect x="146" y="240" width="26" height="22" rx="2"/>
    <rect x="184" y="240" width="26" height="22" rx="2"/>
    <rect x="222" y="240" width="26" height="22" rx="2"/>
    <rect x="260" y="240" width="26" height="22" rx="2"/>
  </g>
  <!-- door -->
  <rect x="182" y="290" width="30" height="40" rx="2" fill="#00A6D6"/>
  <!-- chimneys -->
  <rect x="110" y="130" width="22" height="60" rx="3" fill="#1C7293"/>
  <rect x="146" y="150" width="18" height="40" rx="3" fill="#1C7293"/>
  <!-- steam -->
  <g fill="#FFFFFF" stroke="#D6EBF5" stroke-width="2">
    <circle cx="121" cy="112" r="12"/>
    <circle cx="138" cy="100" r="16"/>
    <circle cx="160" cy="108" r="11"/>
  </g>

  <!-- storage tanks -->
  <g>
    <rect x="330" y="250" width="46" height="80" rx="8" fill="#1C7293"/>
    <ellipse cx="353" cy="250" rx="23" ry="8" fill="#00A6D6"/>
    <rect x="388" y="270" width="40" height="60" rx="7" fill="#1C7293"/>
    <ellipse cx="408" cy="270" rx="20" ry="7" fill="#00A6D6"/>
    <!-- bund wall -->
    <rect x="320" y="322" width="120" height="8" rx="2" fill="#0C536A"/>
  </g>

  <!-- monitoring well -->
  <g>
    <rect x="470" y="300" width="14" height="30" rx="2" fill="#00A6D6"/>
    <rect x="465" y="294" width="24" height="8" rx="2" fill="#0C536A"/>
    <rect x="474" y="336" width="6" height="100" fill="#00A6D6"/>
    <rect x="470" y="420" width="14" height="16" rx="2" fill="#1C7293"/>
  </g>

  <!-- borehole with core sample -->
  <g>
    <rect x="552" y="336" width="10" height="72" fill="#FFFFFF" stroke="#0C536A" stroke-width="2"/>
    <rect x="554" y="340" width="6" height="18" fill="#D6EBF5"/>
    <rect x="554" y="358" width="6" height="22" fill="#C9DDD9"/>
    <rect x="554" y="380" width="6" height="26" fill="#B6CFCA"/>
  </g>

  <!-- consultant with hand auger -->
  <g>
    <!-- auger -->
    <rect x="555" y="230" width="4" height="100" fill="#0C536A"/>
    <rect x="540" y="228" width="34" height="5" rx="2" fill="#0C536A"/>
    <!-- body -->
    <rect x="510" y="255" width="30" height="50" rx="8" fill="#00A6D6"/>
    <!-- legs -->
    <rect x="514" y="302" width="9" height="28" rx="3" fill="#0C536A"/>
    <rect x="527" y="302" width="9" height="28" rx="3" fill="#0C536A"/>
    <!-- arm -->
    <rect x="536" y="262" width="22" height="8" rx="4" fill="#00A6D6"/>
    <!-- head -->
    <circle cx="525" cy="240" r="11" fill="#FFFFFF" stroke="#0C536A" stroke-width="2"/>
    <!-- hard hat -->
    <path d="M512 238 a13 13 0 0 1 26 0 Z" fill="#00A6D6"/>
    <rect x="509" y="236" width="32" height="4" rx="2" fill="#0C536A"/>
  </g>

  <!-- floating checklist card -->
  <g>
    <rect x="410" y="120" width="130" height="96" rx="10" fill="#FFFFFF" stroke="#D7E2E4" stroke-width="2"/>
    <g stroke="#00A6D6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M426 144 l6 6 l11 -12"/>
      <path d="M426 170 l6 6 l11 -12"/>
      <path d="M426 196 l6 6 l11 -12"/>
    </g>
    <g fill="#D6EBF5">
      <rect x="452" y="138" width="70" height="8" rx="4"/>
      <rect x="452" y="164" width="56" height="8" rx="4"/>
      <rect x="452" y="190" width="64" height="8" rx="4"/>
    </g>
  </g>

  <!-- shrubs -->
  <g fill="#3E8E5A">
    <circle cx="60" cy="322" r="10"/>
    <circle cx="74" cy="326" r="7"/>
    <circle cx="596" cy="324" r="8"/>
  </g>
</svg>
