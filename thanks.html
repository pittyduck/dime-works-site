<meta charset="UTF-8">

<style>
:root{--ink:#1B2A2F;--teal:#00A6D6;--deep:#0C536A;--gray:#5C6B70;--line:#D7E2E4;--ice:#E8F4FA}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:#fff;line-height:1.65;display:flex;flex-direction:column;min-height:100vh}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.card{max-width:520px;text-align:center}
.badge{width:76px;height:76px;border-radius:50%;background:var(--ice);display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.badge svg{width:38px;height:38px;color:var(--teal)}
h1{font-size:28px;letter-spacing:-.02em;color:var(--deep);margin-bottom:12px}
p{color:var(--gray);margin-bottom:8px}
.btns{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;background:var(--deep);color:#fff;font-weight:700;padding:13px 26px;border-radius:8px;text-decoration:none}
.btn:hover{background:#1C7293}
.btn.o{background:#fff;color:var(--deep);border:1.5px solid var(--line)}
footer{border-top:1px solid var(--line);padding:24px;text-align:center;font-size:13px;color:var(--gray)}
footer a{color:#1C7293;text-decoration:none}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 l5.5 5.5 L20 7"/></svg></div>
    <h1>문의가 접수되었습니다</h1>
    <p>보내주신 내용을 확인한 뒤 <b>1영업일 이내</b>에 회신드리겠습니다.</p><p>빠른 확인이 필요하시면 <a href='mailto:edward.min@dime-works.com' style='color:#1C7293'>edward.min@dime-works.com</a>으로 직접 연락 주세요.</p>
    <div class="btns">
      <a class="btn" href="index.html">홈으로 돌아가기</a>
      <a class="btn o" href="insights/">인사이트 보기</a>
    </div>
  </div>
</main>
